<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Connection | SysReaper Labs</title>
    <style>
        :root {
            --terminal-green: #09ff00;
            --dark-bg: #080808;
            --sys-purple: #a18aec;
            --text-white: #e0e0e0;
            --sys-red: #e9291f;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
            color: var(--terminal-green);
        }

        .container {
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            min-height: 100vh; padding: 40px 20px;
            box-sizing: border-box;
        }

        .nav-bar {
            width: 100%; max-width: 900px;
            display: flex; justify-content: center;
            gap: 25px; margin-bottom: 30px;
            padding: 10px 0; border-bottom: 1px solid #222;
        }

        .nav-link {
            color: var(--terminal-green); text-decoration: none;
            font-size: 13px; letter-spacing: 2px; transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--sys-purple); text-shadow: 0 0 8px var(--sys-purple);
        }

        .logo-container {
            margin-bottom: 40px;
            text-align: center;
            animation: pulse-glow 4s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 5px var(--sys-purple)); }
            50% { filter: drop-shadow(0 0 20px var(--sys-purple)); }
            100% { filter: drop-shadow(0 0 5px var(--sys-purple)); }
        }

        .logo { width: 320px; max-width: 85%; height: auto; }

        .terminal-window {
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #333; border-radius: 8px;
            width: 100%; max-width: 800px; padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            position: relative; margin-bottom: 30px;
        }

        .terminal-header {
            position: absolute; top: 0; left: 0; right: 0;
            height: 30px; background: #1a1a1a;
            border-bottom: 1px solid #333; display: flex;
            align-items: center; padding-left: 15px;
            border-radius: 8px 8px 0 0;
        }

        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .red-dot { background: #ff5f56; } .yellow-dot { background: #ffbd2e; } .green-dot { background: #27c93f; }

        .highlight { color: var(--sys-purple); font-weight: bold; }
        
        /* Form Styling */
        form { margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            color: var(--sys-purple); 
            font-size: 14px; 
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: var(--text-white);
            font-family: 'Courier New', monospace;
            padding: 10px 0;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-bottom: 1px solid var(--terminal-green);
        }

        .send-btn {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 15px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .send-btn:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 20px var(--terminal-green);
        }

        .contact-info {
            margin-top: 30px;
            font-size: 14px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="index.html" class="nav-link">[ 01 : HOME ]</a>
            <a href="services.html" class="nav-link">[ 02 : SERVICES ]</a>
            <a href="about.html" class="nav-link">[ 03 : INTEL ]</a>
            <a href="contact.html" class="nav-link active">[ 04 : CONNECT ]</a>
        </nav>

        <div class="logo-container">
            <img src="team.png" alt="SysReaper Labs" class="logo">
        </div>

        <div class="terminal-window">
            <div class="terminal-header">
                <span class="dot red-dot"></span><span class="dot yellow-dot"></span><span class="dot green-dot"></span>
                <span style="margin-left: 12px; font-size: 12px; color: #888;">sysreaperlabs@parrot: ~/secure_uplink</span>
            </div>
            <br>
            <p class="highlight"># ESTABLISHING SECURE HANDSHAKE...</p>
            <p style="color: var(--text-white); font-size: 14px;">Enter mission parameters below to initialize connection with SysReaper Command.</p>

            <form action="https://formspree.io/f/your_form_id_here" method="POST">
                <div class="form-group">
                    <label>// NAME_OR_ENTITY</label>
                    <input type="text" name="name" required placeholder="Enter ID...">
                </div>
                <div class="form-group">
                    <label>// RETURN_UPLINK_EMAIL</label>
                    <input type="email" name="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>// COMPLIANCE_FRAMEWORK_FOCUS</label>
                    <input type="text" name="framework" placeholder="CMMC, NIST, DFARS, ITAR, PCI...">
                </div>
                <div class="form-group">
                    <label>// MISSION_OBJECTIVES</label>
                    <textarea name="message" rows="4" placeholder="Briefly describe your security or compliance needs..."></textarea>
                </div>
                <button type="submit" class="send-btn">TRANSMIT DATA</button>
            </form>
            
            <div class="contact-info">
                <p><span class="highlight">DIRECT_COMMS:</span> info@sysreaperlabs.com</p>
                <p><span class="highlight">POSTURE:</span> Ready for Engagement</p>
            </div>
        </div>
    </div>

</body>
</html>
